<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-theme-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎓 Шпаргалка экзаменов СМП</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0f14;
  --bg-2: #111823;
  --panel: #16202e;
  --panel-2: #1c2839;
  --panel-3: #223147;
  --text: #e8eef7;
  --text-soft: #c9d5e3;
  --muted: #8496ab;
  --border: #26344a;
  --accent: #2f9e44;
  --accent-2: #37b24d;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --input-bg: #0d1520;
  --card-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* ============================================================
   СВЕТЛАЯ ТЕМА
   ============================================================ */
:root[data-theme="light"] {
  --bg: #f5f7fa;
  --bg-2: #ffffff;
  --panel: #ffffff;
  --panel-2: #f0f4f8;
  --panel-3: #e2e8f0;
  --text: #1a202c;
  --text-soft: #2d3748;
  --muted: #64748b;
  --border: #cbd5e0;
  --accent: #2f9e44;
  --accent-2: #268a3a;
  --blue: #2563eb;
  --purple: #7c3aed;
  --input-bg: #ffffff;
  --card-shadow: 0 6px 20px rgba(15,23,42,0.08);
}

html, body { height: 100%; }

html::-webkit-scrollbar,
body::-webkit-scrollbar { width: 0; display: none; }

body {
  font-family: var(--font);
  background: radial-gradient(circle at top, #16202e 0%, var(--bg) 60%);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding: 16px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  scrollbar-width: none;
  -ms-overflow-style: none;
  transition: background 0.25s, color 0.25s;
}
:root[data-theme="light"] body {
  background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 60%);
}

.wrap { max-width: 1100px; width: 100%; }

/* ---------- Карточки ---------- */
.card {
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--card-shadow);
  margin-bottom: 14px;
  transition: background 0.25s, border-color 0.25s;
}
:root[data-theme="light"] .card {
  background: var(--panel);
}
.card h3 {
  font-size: 0.98rem;
  font-weight: 600;
  margin-bottom: 14px;
}
.form-group { margin-bottom: 0; }
label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
select, .search-input {
  width: 100%;
  padding: 12px 14px;
  font-size: 0.96rem;
  font-family: inherit;
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.25s;
  -webkit-appearance: none;
  appearance: none;
}
select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238496ab' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 18px;
  padding-right: 40px;
}
select:focus, .search-input:focus {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(47, 158, 68, 0.22);
}
.search-input { margin-top: 10px; }
.search-input::placeholder { color: var(--muted); }

/* ---------- Экзамен ---------- */
.exam-card {
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--card-shadow);
  transition: background 0.25s, border-color 0.25s;
}
:root[data-theme="light"] .exam-card {
  background: var(--panel);
}

/* Заголовок "Вопросы и ответы на экзамен:" + кнопка */
.exam-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--border);
}
.exam-head-left { flex: 1; min-width: 0; }
.exam-head-label {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 4px;
}
.exam-head-title {
  font-size: 1.02rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.exam-rank-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--purple), #6d28d9);
  color: #fff;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.02em;
}

.toggle-all-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--panel-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.toggle-all-btn:hover {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}
.toggle-all-btn svg {
  width: 14px;
  height: 14px;
}

.exam-note {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 12px;
  line-height: 1.55;
}
.exam-empty {
  text-align: center;
  padding: 24px 12px;
  color: var(--muted);
  font-size: 0.9rem;
}

details {
  background: var(--panel-3);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 8px 0;
  overflow: hidden;
  transition: background 0.25s, border-color 0.25s;
}
details summary {
  cursor: pointer;
  padding: 11px 14px;
  font-size: 0.86rem;
  font-weight: 700;
  list-style: none;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  transition: background 0.15s;
  color: var(--text);
}
details summary::-webkit-details-marker { display: none; }
details summary::before {
  content: "❓";
  flex-shrink: 0;
}
details[open] summary {
  background: rgba(139, 92, 246, 0.12);
  color: #c4b5fd;
}
:root[data-theme="light"] details[open] summary {
  color: #6d28d9;
}
details .ans {
  padding: 11px 14px 13px;
  font-size: 0.85rem;
  line-height: 1.65;
  border-top: 1px dashed var(--border);
  color: var(--text);
}
details .ans b { color: #86efac; }
:root[data-theme="light"] details .ans b { color: #166534; }

/* ---------- Мобилка ---------- */
@media (max-width: 600px) {
  body { padding: 12px 12px 20px; }
  .card, .exam-card { padding: 14px; border-radius: 14px; }
  .exam-head { flex-direction: column; }
  .toggle-all-btn { width: 100%; justify-content: center; }
  details summary { font-size: 0.82rem; padding: 10px 12px; }
  details .ans { font-size: 0.82rem; padding: 10px 12px 12px; }
}
</style>
</head>

<div class="wrap">

  <div class="card">
    <div class="form-group">
      <label for="examSelect">Экзамен</label>

      </select>

</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     ТЕМА
     ============================================================ */
  const THEME_KEY = "pref_theme";

  function systemTheme() {
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) { return "dark"; }
  }
  function resolveThemeMode(mode) {
    if (mode === "auto") return systemTheme();
    return mode === "light" ? "light" : "dark";
  }
  function applyThemeMode(mode) {
    if (!["light","dark","auto"].includes(mode)) mode = "dark";
    const resolved = resolveThemeMode(mode);
    document.documentElement.setAttribute("data-theme", resolved);
    document.documentElement.setAttribute("data-theme-mode", mode);
  }
  function initTheme() {
    const p = new URLSearchParams(location.search);
    const urlTheme = p.get("theme");
    if (urlTheme && ["light","dark","auto"].includes(urlTheme)) {
      applyThemeMode(urlTheme);
      return;
    }
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved && ["light","dark","auto"].includes(saved)) {
        applyThemeMode(saved);
        return;
      }
    } catch (e) {}
    applyThemeMode("dark");
  }

  window.addEventListener("message", (e) => {
    if (!e.data || typeof e.data !== "object") return;
    if (e.data.type === "theme" && e.data.mode) {
      applyThemeMode(e.data.mode);
    }
  });

  try {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq && mq.addEventListener) {
      mq.addEventListener("change", () => {
        const mode = document.documentElement.getAttribute("data-theme-mode");
        if (mode === "auto") applyThemeMode("auto");
      });
    } else if (mq && mq.addListener) {
      mq.addListener(() => {
        const mode = document.documentElement.getAttribute("data-theme-mode");
        if (mode === "auto") applyThemeMode("auto");
      });
    }
  } catch (e) {}

  initTheme();

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "theme-request" }, "*");
    }
  } catch (e) {}

  /* ============================================================
   *  ДАННЫЕ ЭКЗАМЕНОВ
   * ============================================================ */

        ["Что разрешено при ПМП?", "✅ Заехать в магазин/банк <b>при отсутствии вызовов</b>; ✅ <b>отменить вызов при угрозе жизни</b>."],

  /* ============================================================
   *  СОСТОЯНИЕ

  const state = {
    currentExam: "ex1",
    searchQuery: "",
    allExpanded: false
  };

  const examSelect = document.getElementById("examSelect");
  const examSearch = document.getElementById("examSearch");
  const examBody = document.getElementById("examBody");

  /* ============================================================
   *  РЕНДЕР
   * ============================================================ */
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function render() {
    const data = EXAM_DATA[state.currentExam];
    if (!data) {
      examBody.innerHTML = '<div class="exam-card"><div class="exam-empty">Экзамен не найден</div></div>';
      return;
    }

    const q = state.searchQuery.trim().toLowerCase();
    const filtered = q
      ? data.qa.filter((pair) => (pair[0] + " " + pair[1]).toLowerCase().includes(q))
      : data.qa;

    const forceOpen = q.length > 0;

    let html = '<div class="exam-card">';

    html += '<div class="exam-head">';
    html += '<div class="exam-head-left">';
    html += '<div class="exam-head-label">Вопросы и ответы на экзамен:</div>';
    html += '<div class="exam-head-title">' +
              escapeHtml(data.title) +
              (data.rank ? ' <span class="exam-rank-badge">' + data.rank + '</span>' : '') +
            '</div>';
    html += '</div>';

    if (!forceOpen && filtered.length > 0) {
      html += '<button class="toggle-all-btn" id="toggleAllBtn" type="button">';
      if (state.allExpanded) {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
        html += 'Свернуть все';
      } else {
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
        html += 'Развернуть все';
      }
      html += '</button>';
    }
    html += '</div>';

    if (data.note) {
      html += '<div class="exam-note">' + data.note + '</div>';
    }

    if (!filtered.length) {
      html += '<div class="exam-empty">Ничего не найдено по запросу «' + escapeHtml(state.searchQuery) + '»</div>';
    } else {
      filtered.forEach((pair) => {
        const open = (forceOpen || state.allExpanded) ? " open" : "";
        html += '<details' + open + '><summary>' + pair[0] + '</summary><div class="ans">' + pair[1] + '</div></details>';
      });
    }

    html += '</div>';
    examBody.innerHTML = html;

    const toggleBtn = document.getElementById("toggleAllBtn");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", toggleAll);
    }
  }

  /* ============================================================
   *  РАЗВЕРНУТЬ / СВЕРНУТЬ ВСЕ
   * ============================================================ */
  function toggleAll() {
    state.allExpanded = !state.allExpanded;
    const details = examBody.querySelectorAll("details");
    details.forEach((d) => {
      if (state.allExpanded) d.setAttribute("open", "");
      else d.removeAttribute("open");
    });
    const toggleBtn = document.getElementById("toggleAllBtn");
    if (toggleBtn) {
      toggleBtn.innerHTML = state.allExpanded
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>Свернуть все'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>Развернуть все';
    }
  }

  /* ============================================================
   *  СОБЫТИЯ
   * ============================================================ */
  function init() {
    examSelect.addEventListener("change", () => {
      state.currentExam = examSelect.value;
      state.searchQuery = "";
      state.allExpanded = false;
      examSearch.value = "";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    examSearch.addEventListener("input", () => {
      state.searchQuery = examSearch.value;
      if (state.searchQuery.trim()) {
        state.allExpanded = false;
      }
      render();
    });

    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
